# Landing server block from /etc/nginx/sites-available/olgamrzvcrm.ru.conf (kept here for history).
# The same file on the server also holds the default servers, the http redirect and the app block - not copied here.
# The only line added for security headers is the include below.
# Not used by the deploy: nginx is changed by hand on the server (needs sudo).
#
# server_tokens off is already set server-wide in /etc/nginx/conf.d/crm-hardening.conf.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name olgamrzvcrm.ru;
    include snippets/crm-ssl.conf;
    root /var/www/landing;
    include snippets/landing-security-headers.conf;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
