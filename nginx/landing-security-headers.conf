# Security headers for the landing (olgamrzvcrm.ru).
# Server path: /etc/nginx/snippets/landing-security-headers.conf
# Included from the landing server block only; the app server block is not touched.
# "always" makes nginx send the headers on error pages (404 etc.) too.

# HSTS: 1 year. No includeSubDomains/preload: app.* and test-app.* share the domain.
add_header Strict-Transport-Security "max-age=31536000" always;

# CSP without nonce: inline scripts and styles are allowed, the page stays as it is.
# Google Fonts: CSS from fonts.googleapis.com, font files from fonts.gstatic.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# No embedding in frames (old browsers read X-Frame-Options, new ones read frame-ancestors)
add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
